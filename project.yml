name: PhoneMirror

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MirrorKit:
    path: Packages/MirrorKit

targets:
  PhoneMirror:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MirrorKit
        products: [Video, Control]
    entitlements:
      path: App/PhoneMirror.entitlements
      properties:
        # Required by the Hardened Runtime to open a capture device.
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PhoneMirror
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneMirror
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          PhoneMirror a besoin de cet accès pour afficher l'écran de votre iPhone
          branché en USB. Aucune image n'est enregistrée ni envoyée.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  PhoneMirror:
    build:
      targets:
        PhoneMirror: all
    run:
      config: Debug
