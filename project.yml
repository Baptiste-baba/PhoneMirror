name: PhoneMirror

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MirrorKit:
    path: Packages/MirrorKit

targets:
  PhoneMirror:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MirrorKit
        products: [Video, Control]
    settings:
      base:
        # Referenced as a build setting rather than XcodeGen's `entitlements:` key,
        # which would regenerate (and overwrite) the versioned file.
        CODE_SIGN_ENTITLEMENTS: App/PhoneMirror.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(PRODUCT_NAME:rfc1034identifier)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          PhoneMirror a besoin de cet accès pour afficher l'écran de votre iPhone
          branché en USB. Aucune image n'est enregistrée ni envoyée.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          PhoneMirror a besoin de cet accès pour faire entendre sur ce Mac le son
          de votre iPhone. Aucun son n'est enregistré ni envoyé.
    scheme: {}
